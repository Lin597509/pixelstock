<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelStock - 高清视频素材库</title>
<meta name="description" content="PixelStock 高清视频素材库，精选 4K/8K 视频素材免费下载，覆盖自然风光、城市建筑、科技特效等多种场景。">
<style>
  /* ========== 主题变量 ========== */
  :root {
    --radius-sm: 8px;
    --radius: 12px;
    --radius-lg: 16px;
    --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }

  [data-theme="dark"] {
    --bg: #0a0a0f; --bg2: #0f0f17; --surface: #13131a; --surface2: #1a1a24;
    --surface3: #22222e; --border: #252530; --border-hover: #3a3a4a;
    --text: #e4e4eb; --text2: #b0b0c0; --text-dim: #8888a0;
    --accent: #6c5ce7; --accent2: #a29bfe; --accent-glow: rgba(108,92,231,0.25);
    --tag-bg: #1e1e2e; --card-shadow: 0 4px 24px rgba(0,0,0,0.4);
    --card-shadow-hover: 0 16px 48px rgba(108,92,231,0.18);
    --nav-bg: rgba(10,10,15,0.82); --hero-glow: radial-gradient(ellipse at 50% 50%, rgba(108,92,231,0.1) 0%, transparent 70%);
    --toast-bg: #1a1a24; --overlay-bg: rgba(0,0,0,0.88); --input-bg: #1a1a24;
    --scrollbar-thumb: #2a2a38; --scrollbar-track: transparent;
    --success: #00b894; --danger: #ff7675;
  }

  [data-theme="light"] {
    --bg: #f5f5fa; --bg2: #fafafe; --surface: #ffffff; --surface2: #f0f0f8;
    --surface3: #e8e8f2; --border: #e0e0ec; --border-hover: #c8c8d8;
    --text: #1a1a2e; --text2: #4a4a5e; --text-dim: #8888a0;
    --accent: #6c5ce7; --accent2: #5a4bd1; --accent-glow: rgba(108,92,231,0.15);
    --tag-bg: #e8e8f4; --card-shadow: 0 2px 16px rgba(0,0,0,0.06);
    --card-shadow-hover: 0 12px 36px rgba(108,92,231,0.12);
    --nav-bg: rgba(255,255,255,0.82); --hero-glow: radial-gradient(ellipse at 50% 50%, rgba(108,92,231,0.06) 0%, transparent 70%);
    --toast-bg: #ffffff; --overlay-bg: rgba(0,0,0,0.6); --input-bg: #f0f0f8;
    --scrollbar-thumb: #c8c8d8; --scrollbar-track: #f0f0f8;
    --success: #00b894; --danger: #e17055;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font); background: var(--bg);
    color: var(--text); line-height: 1.6; overflow-x: hidden;
    transition: background var(--transition), color var(--transition);
  }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }

  @keyframes fadeInUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes scaleIn { from { opacity:0; transform:scale(0.92); } to { opacity:1; transform:scale(1); } }
  @keyframes shimmer { 0%{background-position:-200% 0;} 100%{background-position:200% 0;} }

  .reveal { opacity:0; transform:translateY(30px); transition:opacity 0.6s ease, transform 0.6s ease; }
  .reveal.visible { opacity:1; transform:translateY(0); }

  /* ========== Navbar ========== */
  .navbar {
    position:sticky; top:0; z-index:100; background:var(--nav-bg);
    backdrop-filter:blur(24px) saturate(180%); -webkit-backdrop-filter:blur(24px) saturate(180%);
    border-bottom:1px solid var(--border); padding:0 24px;
    display:flex; align-items:center; justify-content:space-between; height:62px;
    transition:background var(--transition),border-color var(--transition);
  }
  .nav-logo {
    font-size:1.4rem; font-weight:800; cursor:pointer;
    background:linear-gradient(135deg,#6c5ce7,#a29bfe);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; letter-spacing:-0.5px;
  }
  .nav-links { display:flex; gap:28px; list-style:none; }
  .nav-links a {
    color:var(--text-dim); text-decoration:none; font-size:0.9rem;
    transition:var(--transition); font-weight:500; position:relative; padding:4px 0; cursor:pointer;
  }
  .nav-links a::after { content:''; position:absolute; bottom:-2px; left:0; width:0; height:2px; background:var(--accent); border-radius:1px; transition:width var(--transition); }
  .nav-links a:hover, .nav-links a.active { color:var(--text); }
  .nav-links a:hover::after, .nav-links a.active::after { width:100%; }
  .nav-actions { display:flex; gap:10px; align-items:center; }

  .theme-toggle {
    width:38px; height:38px; border-radius:50%; background:var(--surface2);
    border:1px solid var(--border); cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-size:1.1rem; transition:var(--transition); position:relative; overflow:hidden;
  }
  .theme-toggle:hover { border-color:var(--accent); transform:rotate(15deg); }
  .theme-toggle .icon-sun, .theme-toggle .icon-moon { position:absolute; transition:var(--transition); }
  [data-theme="dark"] .icon-sun { opacity:1; transform:scale(1); }
  [data-theme="dark"] .icon-moon { opacity:0; transform:scale(0.5); }
  [data-theme="light"] .icon-sun { opacity:0; transform:scale(0.5); }
  [data-theme="light"] .icon-moon { opacity:1; transform:scale(1); }

  /* ========== 按钮 ========== */
  .btn {
    padding:9px 22px; border-radius:var(--radius-sm); border:none;
    font-size:0.875rem; font-weight:600; cursor:pointer;
    transition:all var(--transition); font-family:inherit; position:relative; overflow:hidden;
  }
  .btn:active { transform:scale(0.96); }
  .btn-primary { background:var(--accent); color:#fff; box-shadow:0 4px 16px var(--accent-glow); }
  .btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 24px var(--accent-glow); }
  .btn-outline { background:transparent; color:var(--text); border:1px solid var(--border); }
  .btn-outline:hover { border-color:var(--accent); color:var(--accent); background:var(--surface2); }
  .btn-sm { padding:6px 16px; font-size:0.8rem; }
  .btn-download { background:linear-gradient(135deg,#00b894,#00cec9); color:#fff; border:none; }
  .btn-download:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,184,148,0.35); }
  .btn-lg { padding:12px 32px; font-size:1rem; }
  .btn-danger { background:var(--danger); color:#fff; }
  .btn-fav { background:transparent; color:var(--text-dim); border:1px solid var(--border); padding:4px 8px; min-width:0; cursor:pointer; border-radius:6px; transition:0.2s; }
  .btn-fav:hover { background:rgba(255,193,7,0.1); color:#ffc107; border-color:#ffc107; }
  .btn-fav.favorited { background:rgba(255,193,7,0.15); color:#ffc107; border-color:#ffc107; }
  .btn-fav-card { background:transparent; color:var(--text-dim); border:1px solid var(--border); padding:4px 8px; min-width:0; cursor:pointer; border-radius:6px; transition:0.2s; font-size:0.85rem; }
  .btn-fav-card:hover { background:rgba(255,193,7,0.1); color:#ffc107; border-color:#ffc107; }
  .btn-fav-card.favorited { background:rgba(255,193,7,0.15); color:#ffc107; border-color:#ffc107; }
  .btn-icon { padding:4px 8px; min-width:0; background:transparent; border:1px solid var(--border); border-radius:6px; cursor:pointer; transition:0.2s; }
  .fav-icon { font-size:0.9rem; }

  .ripple { position:absolute; border-radius:50%; background:rgba(255,255,255,0.3); transform:scale(0); animation:ripple 0.6s ease-out; pointer-events:none; }
  @keyframes ripple { to { transform:scale(4); opacity:0; } }

  /* ========== 页面容器 ========== */
  .page { animation:fadeInUp 0.4s ease; min-height:calc(100vh - 62px); }
  .page-container { max-width:1280px; margin:0 auto; padding:0 24px 60px; }

  /* ========== Hero（首页） ========== */
  .hero {
    padding:90px 24px 70px; text-align:center; position:relative; overflow:hidden;
  }
  .hero::before { content:''; position:absolute; top:-50%; left:-50%; width:200%; height:200%; background:var(--hero-glow); pointer-events:none; }
  .hero h1 { font-size:clamp(2rem,5vw,3.4rem); font-weight:800; letter-spacing:-1.5px; position:relative; }
  .hero h1 span { background:linear-gradient(135deg,#6c5ce7,#fd79a8,#00cec9); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-size:200% auto; animation:shimmer 3s linear infinite; }
  .hero p { color:var(--text-dim); font-size:1.1rem; max-width:560px; margin:18px auto 0; position:relative; }
  .hero-stats { display:flex; gap:48px; justify-content:center; margin-top:40px; position:relative; }
  .hero-stat { text-align:center; }
  .hero-stat .num { font-size:2rem; font-weight:800; background:linear-gradient(135deg,#6c5ce7,#a29bfe); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .hero-stat .label { font-size:0.82rem; color:var(--text-dim); margin-top:4px; }

  /* ========== Toolbar（首页） ========== */
  .toolbar { max-width:1280px; margin:0 auto; padding:0 24px 24px; display:flex; gap:16px; flex-wrap:wrap; align-items:center; }
  .search-box { flex:1; min-width:240px; position:relative; }
  .search-box input { width:100%; padding:13px 16px 13px 44px; background:var(--input-bg); border:1.5px solid var(--border); border-radius:var(--radius); color:var(--text); font-size:0.9rem; outline:none; transition:all var(--transition); }
  .search-box input:focus { border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-glow); }
  .search-box .icon { position:absolute; left:15px; top:50%; transform:translateY(-50%); color:var(--text-dim); pointer-events:none; }
  .filter-tags { display:flex; gap:8px; flex-wrap:wrap; }
  .tag { padding:7px 18px; border-radius:20px; background:var(--tag-bg); color:var(--text-dim); font-size:0.82rem; cursor:pointer; border:1.5px solid transparent; transition:all var(--transition); user-select:none; font-weight:500; }
  .tag:hover { border-color:var(--border-hover); color:var(--text); transform:translateY(-1px); }
  .tag.active { background:var(--accent); color:#fff; border-color:var(--accent); box-shadow:0 4px 12px var(--accent-glow); }

  /* ========== 分类侧边栏 ========== */
  .main-layout { max-width:1280px; margin:0 auto; padding:0 24px 60px; display:flex; gap:24px; align-items:flex-start; }
  .category-sidebar {
    width:180px; flex-shrink:0; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-lg); padding:20px 0; position:sticky; top:80px;
    box-shadow:var(--card-shadow);
  }
  .sidebar-title { font-size:0.85rem; font-weight:700; color:var(--text); padding:0 20px 14px; border-bottom:1px solid var(--border); margin-bottom:8px; letter-spacing:0.5px; }
  .category-list { display:flex; flex-direction:column; }
  .cat-item {
    display:flex; align-items:center; gap:10px; padding:10px 20px; cursor:pointer;
    transition:all 0.2s; border-left:3px solid transparent; font-size:0.85rem;
    color:var(--text-dim); user-select:none;
  }
  .cat-item:hover { background:var(--surface2); color:var(--text); }
  .cat-item.active {
    background:var(--accent-glow); color:var(--accent); font-weight:600;
    border-left-color:var(--accent);
  }
  .cat-parent-wrap { display:flex; flex-direction:column; }
  .cat-parent { position:relative; }
  .cat-arrow { margin-left:auto; font-size:0.6rem; transition:transform 0.25s; color:var(--text-dim); }
  .cat-arrow.expanded { transform:rotate(90deg); }
  .subcat-list { max-height:0; overflow:hidden; transition:max-height 0.3s ease, padding 0.3s ease; background:var(--surface2); }
  .subcat-list.show { max-height:500px; padding:6px 0; }
  .subcat-item {
    padding:7px 20px 7px 54px; font-size:0.8rem; cursor:pointer; transition:all 0.15s;
    color:var(--text-dim); border-left:3px solid transparent;
  }
  .subcat-item:hover { background:var(--surface); color:var(--text); }
  .subcat-item.active { color:var(--accent); font-weight:600; border-left-color:var(--accent-info); background:var(--accent-glow); }
  .cat-icon { font-size:1.1rem; width:24px; text-align:center; flex-shrink:0; }
  .cat-name { white-space:nowrap; }
  .main-content { flex:1; min-width:0; }

  /* ========== Grid ========== */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:22px; }
  .card {
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    overflow:hidden; transition:all var(--transition); cursor:pointer; box-shadow:var(--card-shadow);
  }
  .card:hover { border-color:var(--accent); transform:translateY(-6px); box-shadow:var(--card-shadow-hover); }
  .card-thumb { width:100%; height:190px; background:var(--surface2); position:relative; overflow:hidden; }
  .card-thumb .thumb-inner { width:100%; height:100%; display:flex; align-items:center; justify-content:center; transition:transform 0.5s ease; }
  .card:hover .thumb-inner { transform:scale(1.05); }
  .card-thumb .thumb-icon { font-size:3.2rem; opacity:0.5; transition:all var(--transition); }
  .card:hover .thumb-icon { opacity:0.7; transform:scale(1.1); }
  .card-badge { position:absolute; top:12px; right:12px; padding:4px 12px; border-radius:6px; font-size:0.7rem; font-weight:700; letter-spacing:0.5px; pointer-events:none; z-index:2; backdrop-filter:blur(8px); }
  .card-badge.free { background:rgba(0,184,148,0.88); color:#fff; }
  .card-badge.pro { background:rgba(253,121,168,0.88); color:#fff; }
  .card-body { padding:18px; }
  .card-title { font-size:0.95rem; font-weight:700; margin-bottom:6px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .card-meta { display:flex; gap:14px; flex-wrap:wrap; font-size:0.75rem; color:var(--text-dim); margin-bottom:14px; }
  .card-meta span { display:flex; align-items:center; gap:4px; }
  .card-actions { display:flex; gap:8px; }
  .card-actions .btn { flex:1; text-align:center; }

  /* ========== 详情页 ========== */
  .detail-hero {
    position:relative; overflow:hidden; padding:60px 0 40px;
    display:flex; gap:40px; align-items:flex-start;
  }
  .detail-preview {
    flex:0 0 520px; border-radius:var(--radius-lg); overflow:hidden;
    background:var(--surface2); border:1px solid var(--border);
    min-height:340px; display:flex; align-items:center; justify-content:center;
    transition:all var(--transition);
  }
  .detail-preview .preview-icon { font-size:6rem; opacity:0.4; }
  .detail-info { flex:1; }
  .detail-info h1 { font-size:1.8rem; font-weight:800; margin-bottom:8px; }
  .detail-info .detail-desc { color:var(--text-dim); font-size:1rem; margin-bottom:24px; line-height:1.7; }
  .detail-specs { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:24px; }
  .detail-spec {
    text-align:center; padding:14px 10px; background:var(--surface2);
    border-radius:var(--radius-sm); border:1px solid var(--border);
    transition:var(--transition);
  }
  .detail-spec:hover { border-color:var(--accent); }
  .detail-spec .spec-val { font-size:1.2rem; font-weight:700; }
  .detail-spec .spec-lbl { font-size:0.75rem; color:var(--text-dim); margin-top:2px; }
  .detail-actions { display:flex; gap:12px; }

  .back-link {
    display:inline-flex; align-items:center; gap:6px; color:var(--text-dim);
    text-decoration:none; font-size:0.85rem; margin-bottom:20px; cursor:pointer;
    transition:var(--transition);
  }
  .back-link:hover { color:var(--accent); }

  /* ========== 关于页 ========== */
  .about-hero {
    text-align:center; padding:80px 24px 50px; position:relative;
  }
  .about-hero::before { content:''; position:absolute; top:-50%; left:-50%; width:200%; height:200%; background:var(--hero-glow); pointer-events:none; }
  .about-hero h1 { font-size:2.2rem; font-weight:800; position:relative; }
  .about-hero .subtitle { color:var(--text-dim); font-size:1rem; margin-top:12px; position:relative; }
  .about-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px; margin-top:40px; }
  .about-card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-lg); padding:28px; text-align:center;
    transition:all var(--transition);
  }
  .about-card:hover { border-color:var(--accent); transform:translateY(-4px); }
  .about-card .icon { font-size:2.5rem; margin-bottom:16px; }
  .about-card h3 { font-size:1.1rem; margin-bottom:8px; }
  .about-card p { color:var(--text-dim); font-size:0.88rem; line-height:1.6; }

  .about-team { margin-top:50px; text-align:center; }
  .about-team h2 { font-size:1.5rem; margin-bottom:28px; }
  .team-grid { display:flex; gap:24px; justify-content:center; flex-wrap:wrap; }
  .team-card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-lg); padding:24px; text-align:center;
    width:200px; transition:var(--transition);
  }
  .team-card:hover { border-color:var(--accent); transform:translateY(-3px); }
  .team-avatar { width:64px; height:64px; border-radius:50%; background:var(--accent); margin:0 auto 14px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:1.5rem; font-weight:700; }
  .team-card h4 { font-size:0.95rem; }
  .team-card .role { color:var(--text-dim); font-size:0.78rem; margin-top:4px; }

  /* ========== 上传页 ========== */
  .upload-page { padding:60px 0; }
  .upload-page h1 { font-size:1.8rem; font-weight:800; margin-bottom:8px; }
  .upload-page .upload-sub { color:var(--text-dim); margin-bottom:32px; }
  .upload-zone {
    border:2px dashed var(--border); border-radius:var(--radius-lg);
    padding:60px 30px; text-align:center; cursor:pointer;
    transition:all var(--transition); background:var(--surface);
    margin-bottom:28px;
  }
  .upload-zone:hover, .upload-zone.drag-over {
    border-color:var(--accent); background:var(--surface2);
    box-shadow:0 0 0 6px var(--accent-glow);
  }
  .upload-zone .upload-icon { font-size:3.5rem; margin-bottom:16px; }
  .upload-zone h3 { font-size:1.1rem; margin-bottom:8px; }
  .upload-zone p { color:var(--text-dim); font-size:0.85rem; }
  .upload-form { display:grid; gap:16px; max-width:600px; }
  .form-group { display:flex; flex-direction:column; gap:6px; }
  .form-group label { font-size:0.85rem; font-weight:600; color:var(--text2); }
  .form-group input, .form-group select, .form-group textarea {
    padding:11px 14px; background:var(--input-bg); border:1.5px solid var(--border);
    border-radius:var(--radius-sm); color:var(--text); font-size:0.9rem;
    outline:none; transition:all var(--transition); font-family:inherit; resize:vertical;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow);
  }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .upload-preview-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; margin-top:12px; }
  .upload-preview-item {
    background:var(--surface2); border-radius:var(--radius-sm);
    padding:12px; text-align:center; border:1px solid var(--border);
    font-size:0.78rem;
  }
  .upload-preview-item .file-icon { font-size:1.8rem; margin-bottom:6px; }
  .upload-preview-item .file-name { color:var(--text); word-break:break-all; }
  .upload-preview-item .file-size { color:var(--text-dim); font-size:0.7rem; }

  /* ========== Modal ========== */
  .modal-overlay {
    position:fixed; inset:0; z-index:200; background:var(--overlay-bg);
    display:flex; align-items:center; justify-content:center; animation:fadeIn 0.25s ease;
    backdrop-filter:blur(4px);
  }
  .modal-overlay.hidden { display:none; }
  .modal {
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-lg); max-width:820px; width:92%;
    max-height:85vh; overflow-y:auto; animation:scaleIn 0.3s ease;
    box-shadow:0 24px 80px rgba(0,0,0,0.5);
  }
  .modal-header {
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 24px; border-bottom:1px solid var(--border);
    position:sticky; top:0; background:var(--surface); z-index:1;
    border-radius:var(--radius-lg) var(--radius-lg) 0 0;
  }
  .modal-header h3 { font-size:1.15rem; font-weight:700; }
  .modal-close { background:none; border:none; color:var(--text-dim); font-size:1.5rem; cursor:pointer; padding:4px 10px; border-radius:8px; transition:var(--transition); line-height:1; }
  .modal-close:hover { background:var(--surface2); color:var(--text); }
  .modal-body { padding:24px; }
  .modal-preview { width:100%; border-radius:var(--radius); overflow:hidden; background:var(--surface2); margin-bottom:20px; }
  .modal-preview .preview-placeholder { height:380px; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; }
  .modal-preview .preview-placeholder .preview-icon { font-size:5rem; }
  .modal-preview .preview-placeholder .preview-meta { color:var(--text-dim); font-size:0.9rem; }
  .modal-info { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }

})();

function setPexelsKey(key) {
  localStorage.setItem('pexels_api_key', key);
  showToast(key ? 'Pexels API Key 已保存' : 'API Key 已清除');
}

async function fetchPexelsVideos(q, page = 1) {
  if (!PEXELS_KEY) { pexelsResults = []; pexelsHasMore = false; return []; }
  pexelsLoading = true;
  try {
    const res = await fetch(`https://api.pexels.com/videos/search?query=${encodeURIComponent(q)}&per_page=80&page=${page}`, {
      headers: { 'Authorization': PEXELS_KEY }
    });
    const data = await res.json();
    const videos = (data.videos || []).map(v => ({
      id: 'pxl_' + v.id,
      title: v.user?.name ? `${v.user.name} - 视频` : 'Pexels 视频',
      cat: detectPexelsCat(q),
      res: detectRes(v.video_files),
      dur: formatDur(v.duration),
      size: formatSize(v.video_files),
      fps: v.video_files[0]?.fps || 30,
      format: v.video_files[0]?.file_type?.split('/')[1]?.toUpperCase() || 'MP4',
      badge: 'pexels',
      desc: q || '',
      pexels: true,
      pexelsUrl: v.url,
      pexelsUser: v.user?.name || '',
      pexelsUserUrl: v.user?.url || '',
      thumbnail: v.image || v.video_pictures?.[0]?.picture || '',
      videoFile: bestVideo(v.video_files),
      videoOptions: v.video_files
    }));
    if (page === 1) {
      pexelsResults = videos;
    } else {
      pexelsResults = pexelsResults.concat(videos);
    }
    pexelsHasMore = data.total_results > page * 80;
    return videos;
  } catch (e) {
    console.error('Pexels fetch error:', e);
    if (page === 1) pexelsResults = [];
    if (page === 1) { pexelsResults = []; showToast('⚠️ Pexels API 请求失败，请检查 API Key 或网络连接'); }
    return [];
  } finally { pexelsLoading = false; }
}

function detectRes(files) {
  const max = Math.max(...files.map(f => f.width || 0));
  if (max >= 3840) return '4K';
  if (max >= 2560) return '2K';
  return '1080p';
}
function formatDur(sec) { const m = Math.floor(sec / 60); const s = Math.floor(sec % 60); return m + ':' + (s < 10 ? '0' : '') + s; }
function formatSize(files) {
  const max = files.reduce((a, f) => Math.max(a, f.width || 0), 0);
  const file = files.find(f => f.width === max) || files[0];
  if (!file) return 'N/A';
  const mb = file.file_size ? file.file_size / 1048576 : 0;
  return mb > 1024 ? (mb / 1024).toFixed(1) + 'GB' : mb.toFixed(0) + 'MB';
}
function bestVideo(files) {
  return files.find(f => f.quality === 'hd') || files.find(f => f.quality === 'sd') || files[0];
}
function detectPexelsCat(q) {
  const m = {
    'nature':'自然风光','自然':'自然风光','风景':'自然风光','山':'自然风光','海':'自然风光','森林':'自然风光','湖':'自然风光',
    'city':'城市建筑','城市':'城市建筑','建筑':'城市建筑','街':'城市建筑','都市':'城市建筑',
    'tech':'科技特效','科技':'科技特效','数据':'科技特效','粒子':'科技特效','特效':'科技特效',
    'transition':'特效转场','转场':'特效转场',
    'slow':'慢动作','慢动作':'慢动作','慢镜头':'慢动作'
  };
  for (const [k, v] of Object.entries(m)) { if (q.toLowerCase().includes(k)) return v; }
  return '精选素材';
}

function closeModal(e) { if(e&&e.target!==document.getElementById('modalOverlay'))return; document.getElementById('modalOverlay').classList.add('hidden'); document.body.style.overflow=''; currentAsset=null; }
function downloadAsset(id){
  const idStr=String(id);
  // Pexels 素材：用真实链接下载
  if(idStr.startsWith('pxl_')){
    const p=pexelsResults.find(x=>x.id===idStr);
    if(!p) return;
    showToast(`正在下载「${p.title}」...`);
    const link=document.createElement('a');
    link.href=p.videoFile?.link||p.videoOptions[0]?.link;
    link.download=p.title+'.'+p.format.toLowerCase();
    link.target='_blank';
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    showToast(`下载完成！`);
    return;
  }
  // 真实上传的素材：优先使用 videoPath 直接下载，回退到 IndexedDB
  const a=ASSETS.find(x=>String(x.id)===idStr);
  if(!a){showToast('素材不存在');return;}
  if(a.uploaded){
    if(a.videoPath){
      showToast(`正在下载「${a.title}」...`);
      const link = document.createElement('a');
      link.href = a.videoPath;
      link.download = a.fileName || (a.title + '.' + (a.format||'mp4').toLowerCase());
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
      showToast(`「${a.title}」下载完成！`);
    } else {
      showToast(`正在下载「${a.title}」...`);
      getVideoFile(idStr).then(rec => {
        if(!rec){showToast('文件未找到');return;}
        const blob = new Blob([rec.data], { type: rec.type || 'video/mp4' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = rec.name || (a.title + '.' + (a.format||'mp4').toLowerCase());
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast(`「${a.title}」下载完成！`);
      }).catch(err => {
        console.error(err);
        showToast('下载失败，请重试');
      });
    }
    return;
  }
  // 模拟素材：仅提示
  showToast(`正在准备下载「${a.title}」(${a.size})...`); setTimeout(()=>showToast(`「${a.title}」下载完成！`),1500);
}

function filterAssets() {

// ====== 真实文件存储系统 ======
const DB_NAME = 'pixelstock_files';
const DB_VERSION = 1;
let db = null;

function initDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onerror = () => reject(request.error);
    request.onsuccess = () => { db = request.result; resolve(); };
    request.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('videos')) {
        db.createObjectStore('videos', { keyPath: 'id' });
      }
    };
  });
}

async function saveVideoFile(id, file) {
  if (!db) await initDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('videos', 'readwrite');
    const store = tx.objectStore('videos');
    const reader = new FileReader();
    reader.onload = e => {
      store.put({ id, data: e.target.result, name: file.name, type: file.type, size: file.size });
      resolve();
    };
    reader.onerror = () => reject(reader.error);
    reader.readAsArrayBuffer(file);
  });
}

async function getVideoFile(id) {
  if (!db) await initDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('videos', 'readonly');
    const store = tx.objectStore('videos');
    const request = store.get(String(id));
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function deleteVideoFile(id) {
  if (!db) await initDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('videos', 'readwrite');
    const store = tx.objectStore('videos');
    store.delete(String(id));
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

let _genericModalOverlay = null;
function showModal(html, className) {
  if (_genericModalOverlay) _genericModalOverlay.remove();
  _genericModalOverlay = document.createElement('div');
  _genericModalOverlay.className = 'modal-overlay';
  _genericModalOverlay.onclick = function(e) { if (e.target === _genericModalOverlay) closeModal(); };
  _genericModalOverlay.innerHTML = `<div class="modal ${className||''}" onclick="event.stopPropagation()"><div class="modal-body">${html}</div></div>`;
  document.body.appendChild(_genericModalOverlay);
  document.body.style.overflow = 'hidden';
}
const _origCloseModal = closeModal;
closeModal = function(e) {
  if (_genericModalOverlay) {
    _genericModalOverlay.remove();
    _genericModalOverlay = null;
    document.body.style.overflow = '';
  }
  if (document.getElementById('modalOverlay')?.classList.contains('hidden')) {}
  else _origCloseModal(e);
};

  return `

    <div class="form-group"><label>确认密码</label><input type="password" id="regPassword2" placeholder="再次输入密码"></div>
    <button class="btn btn-primary btn-lg" onclick="doRegister()" style="width:100%;margin-top:8px;">注册</button>
  `;
}

function doLogin() {
  if (currentLoginType === 'phone') {
    const phone = document.getElementById('loginPhone')?.value?.trim();
    const password = document.getElementById('loginPassword')?.value;
    if (!phone || !password) { showToast('请填写手机号和密码'); return; }
    if (!/^1[3-9]\d{9}$/.test(phone)) { showToast('请输入正确的手机号'); return; }
    const users = loadUsers();
    const found = Object.keys(users).find(u => users[u].phone === phone);
    if (!found) { showToast('该手机号未注册'); return; }
    if (users[found].password !== password) { showToast('密码错误'); return; }
    setCurrentUser({ username: found, email: users[found].email, phone: users[found].phone });
    closeModal();
    renderUserMenu();
    showToast(`欢迎回来，${found}！`);
    return;
  }
  const username = document.getElementById('loginUsername')?.value?.trim();
  const password = document.getElementById('loginPassword')?.value;
  if (!username || !password) { showToast('请填写用户名和密码'); return; }
  const users = loadUsers();
  if (!users[username]) { showToast('用户不存在'); return; }
  if (users[username].password !== password) { showToast('密码错误'); return; }
  setCurrentUser({ username, email: users[username].email, phone: users[username].phone });
  closeModal();
  renderUserMenu();
  showToast(`欢迎回来，${username}！`);
}

function doRegister() {
  const username = document.getElementById('regUsername')?.value?.trim();
  const phone = document.getElementById('regPhone')?.value?.trim();
  const email = document.getElementById('regEmail')?.value?.trim();
  const password = document.getElementById('regPassword')?.value;
  const password2 = document.getElementById('regPassword2')?.value;
  if (!username || !email || !password) { showToast('请填写所有必填字段'); return; }
  if (!/^[a-zA-Z0-9_\u4e00-\u9fa5]{3,20}$/.test(username)) { showToast('用户名需3-20位字母数字或中文'); return; }
  if (phone && !/^1[3-9]\d{9}$/.test(phone)) { showToast('手机号格式不正确'); return; }
  if (password.length < 6) { showToast('密码至少6位'); return; }
  if (password !== password2) { showToast('两次密码不一致'); return; }
  const users = loadUsers();
  if (users[username]) { showToast('用户名已存在'); return; }
  if (phone) {
    const phoneExists = Object.keys(users).some(u => users[u].phone === phone);
    if (phoneExists) { showToast('该手机号已被注册'); return; }
  }
  users[username] = { password, email, phone: phone || '' };
  saveUsers(users);
  setCurrentUser({ username, email, phone: phone || '' });
  closeModal();
  renderUserMenu();
  showToast(`注册成功，欢迎 ${username}！`);
}

function logout() {
  clearCurrentUser();
  renderUserMenu();
  showToast('已退出登录');
}

function showUserInfo() {

}

function verifyResetIdentity() {
  const method = document.getElementById('resetMethod')?.value || 'username';
  if (method === 'phone') {
    const phone = document.getElementById('resetPhone')?.value?.trim();
    if (!phone) { showToast('请输入手机号'); return; }
    if (!/^1[3-9]\d{9}$/.test(phone)) { showToast('手机号格式不正确'); return; }
    const users = loadUsers();
    const found = Object.keys(users).find(u => users[u].phone === phone);
    if (!found) { showToast('该手机号未注册'); return; }
    showModal(`
      <h2 style="margin-bottom:8px;">🔑 重置密码</h2>
      <p style="color:var(--text-dim);font-size:0.84rem;margin-bottom:20px;">手机号验证通过！请为 <strong>${found}</strong> 设置新密码。</p>
      <div class="form-group"><label>新密码</label><input type="password" id="newPassword" placeholder="至少6位"></div>
      <div class="form-group"><label>确认新密码</label><input type="password" id="newPassword2" placeholder="再次输入新密码"></div>
      <button class="btn btn-primary btn-lg" onclick="doResetPassword('${found}')" style="width:100%;margin-top:8px;">重置密码</button>
    `, 'user-modal');
    return;
  }
  const username = document.getElementById('resetUsername')?.value?.trim();
  const email = document.getElementById('resetEmail')?.value?.trim();
  if (!username || !email) { showToast('请填写用户名和邮箱'); return; }
  const users = loadUsers();
  if (!users[username]) { showToast('用户名不存在'); return; }
  if (users[username].email !== email) { showToast('邮箱与注册信息不匹配'); return; }
  showModal(`
    <h2 style="margin-bottom:8px;">🔑 重置密码</h2>
    <p style="color:var(--text-dim);font-size:0.84rem;margin-bottom:20px;">身份验证通过！请为 <strong>${username}</strong> 设置新密码。</p>
    <div class="form-group"><label>新密码</label><input type="password" id="newPassword" placeholder="至少6位"></div>
    <div class="form-group"><label>确认新密码</label><input type="password" id="newPassword2" placeholder="再次输入新密码"></div>
    <button class="btn btn-primary btn-lg" onclick="doResetPassword('${username}')" style="width:100%;margin-top:8px;">重置密码</button>
  `, 'user-modal');
}

function doResetPassword(username) {
  const pwd = document.getElementById('newPassword')?.value;
  const pwd2 = document.getElementById('newPassword2')?.value;
  if (!pwd) { showToast('请输入新密码'); return; }
  if (pwd.length < 6) { showToast('密码至少6位'); return; }
  if (pwd !== pwd2) { showToast('两次密码不一致'); return; }
  const users = loadUsers();
  users[username].password = pwd;
  saveUsers(users);
  closeModal();
  showToast(`密码重置成功，请使用新密码登录`);
  showAuthModal('login');
}

function adminFilterTable() {
  const q = (document.getElementById('adminSearchInput')?.value || '').toLowerCase();

function adminToggleAll(cb) {
  document.querySelectorAll('.admin-asset-check').forEach(c => { c.checked = cb.checked; });

}
function adminSelectAll() {
  const checks = document.querySelectorAll('.admin-asset-check');
  const allChecked = Array.from(checks).every(c => c.checked);
  document.getElementById('adminSelectAllCheck').checked = !allChecked;
  checks.forEach(c => { c.checked = !allChecked; });
  adminUpdateBatchBtn();
}
function adminUpdateBatchBtn() {
  const count = document.querySelectorAll('.admin-asset-check:checked').length;
  const btn = document.getElementById('adminBatchDeleteBtn');
  if (btn) { btn.disabled = count === 0; btn.textContent = `批量删除${count?' ('+count+')':''}`; }
}
function adminBatchDelete() {
  const selected = Array.from(document.querySelectorAll('.admin-asset-check:checked'))
    .map(c => parseInt(c.closest('tr').dataset.assetId));
  if (!selected.length) return;
  showAdminModal(`
    <div style="text-align:center;padding:20px 0;">
      <div style="font-size:3rem;margin-bottom:12px;">⚠️</div>
      <h2 style="margin-bottom:12px;">确认批量删除</h2>
      <p style="color:var(--danger);font-size:0.9rem;">将删除选中的 ${selected.length} 个素材，此操作不可恢复</p>
      <div style="display:flex;gap:12px;justify-content:center;margin-top:24px;">
        <button class="btn btn-outline" onclick="closeAdminModal()">取消</button>

      </div>
    </div>
  `);
}
function adminConfirmBatchDelete(ids) {
  ids.forEach(id => { const idx = ASSETS.findIndex(x => x.id === id); if (idx >= 0) ASSETS.splice(idx, 1); });
  persistAssets();
  closeAdminModal();

}

function renderAdminReview() {
  const pending = getPendingAssets();
  if (!pending.length) {
    return `<div style="text-align:center;padding:60px 0;color:var(--text-dim);"><div style="font-size:3rem;margin-bottom:12px;">✅</div><p>暂无待审核素材</p></div>`;
  }
  return `
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead><tr><th>ID</th><th>标题</th><th>分类</th><th>分辨率</th><th>提交时间</th><th>操作</th></tr></thead>
        <tbody>${pending.map(a=>`
          <tr>
            <td>#${a.id}</td><td>${a.title}</td><td>${a.cat}</td><td>${a.res}</td>
            <td>${new Date().toLocaleDateString('zh-CN')}</td>
            <td><div class="actions">
              <button class="btn-icon" onclick="adminApprove(${a.id})" title="通过审核" style="color:var(--success);">✅</button>
              <button class="btn-icon" onclick="adminReject(${a.id})" title="拒绝">❌</button>

function adminApprove(id) {
  const a = ASSETS.find(x => x.id === id);
  if (a) { a.status = 'approved'; persistAssets(); showToast(`「${a.title}」审核通过`); renderAdmin(); }
}
function adminReject(id) {
  const idx = ASSETS.findIndex(x => x.id === id);
  if (idx >= 0) {
    const title = ASSETS[idx].title;
    ASSETS.splice(idx, 1);
    persistAssets();
    showToast(`「${title}」已拒绝并移除`);
    renderAdmin();
  }
}
function adminEditAsset(id) {

    <h2 style="margin-bottom:20px;">✏️ 编辑素材 #${a.id}</h2>

    <div class="form-row">
      <div class="form-group"><label>分类</label><select id="editCat">${cats.filter(c=>c!=='全部').map(c=>`<option ${c===a.cat?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="form-group"><label>分辨率</label><select id="editRes"><option ${a.res==='4K'?'selected':''}>4K</option><option ${a.res==='8K'?'selected':''}>8K</option><option ${a.res==='1080p'?'selected':''}>1080p</option></select></div>

function adminSaveEdit(id) {
  const a = ASSETS.find(x => x.id === id);

  a.title = document.getElementById('editTitle')?.value || a.title;
  a.cat = document.getElementById('editCat')?.value || a.cat;
  a.res = document.getElementById('editRes')?.value || a.res;
  a.fps = parseInt(document.getElementById('editFps')?.value) || a.fps;
  a.badge = document.getElementById('editLicense')?.value || a.badge;

  closeAdminModal();
  showToast(`素材 #${id} 已更新`);
  renderAdmin();
}
function adminDeleteAsset(id) {
  const a = ASSETS.find(x => x.id === id);
  if (!a) return;
  showAdminModal(`
    <div style="text-align:center;padding:20px 0;">
      <div style="font-size:3rem;margin-bottom:12px;">⚠️</div>
      <h2 style="margin-bottom:12px;">确认删除</h2>
      <p style="color:var(--text-dim);margin-bottom:8px;">「${a.title}」</p>
      <p style="color:var(--danger);font-size:0.82rem;">此操作不可恢复</p>
      <div style="display:flex;gap:12px;justify-content:center;margin-top:24px;">
        <button class="btn btn-outline" onclick="closeAdminModal()">取消</button>
        <button class="btn btn-danger" onclick="adminConfirmDelete(${id})">确认删除</button>
      </div>
    </div>
  `);
}
function adminConfirmDelete(id) {
  const idx = ASSETS.findIndex(x => x.id === id);
  if (idx >= 0) { ASSETS.splice(idx, 1); persistAssets(); }
  closeAdminModal();
  showToast(`素材 #${id} 已删除`);
  renderAdmin();
}
function adminAddAsset() {
  showAdminModal(`
    <h2 style="margin-bottom:20px;">➕ 新增素材</h2>
    <div class="form-group"><label>标题 *</label><input type="text" id="addTitle" placeholder="素材标题"></div>
    <div class="form-row">
      <div class="form-group"><label>分类</label><select id="addCat">${cats.filter(c=>c!=='全部').map(c=>`<option>${c}</option>`).join('')}</select></div>
      <div class="form-group"><label>分辨率</label><select id="addRes"><option>4K</option><option>8K</option><option>1080p</option></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>帧率</label><input type="number" id="addFps" value="30"></div>

    </div>

      <button class="btn btn-primary" onclick="adminConfirmAdd()">确认添加</button>

}
function adminConfirmAdd() {
  const title = document.getElementById('addTitle')?.value;
  if (!title) { showToast('请输入标题'); return; }
  const newId = Math.max(...ASSETS.map(a=>a.id), 0) + 1;
  ASSETS.push({
    id: newId, title,
    cat: document.getElementById('addCat')?.value || '自然风光',
    res: document.getElementById('addRes')?.value || '4K',
    dur: document.getElementById('addDur')?.value || '0:30',
    size: document.getElementById('addSize')?.value || '150MB',
    fps: parseInt(document.getElementById('addFps')?.value) || 30,
    format: 'MP4',
    badge: document.getElementById('addLicense')?.value || 'free',
    desc: document.getElementById('addDesc')?.value || '',
    status: 'approved'
  });
  persistAssets();
  closeAdminModal();
  showToast(`「${title}」已添加`);
  renderAdmin();
}

function adminExportCSV() {
  const headers = ['ID','标题','分类','分辨率','时长','大小','帧率','格式','授权','状态','描述'];
  const rows = ASSETS.map(a => [
    a.id, a.title, a.cat, a.res, a.dur, a.size, a.fps, a.format, a.badge, a.status||'approved', a.desc
  ]);
  const csv = [headers.join(','), ...rows.map(r => r.map(v => `"${v}"`).join(','))].join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `PixelStock_素材库_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(`已导出 ${ASSETS.length} 条数据`);
}

function adminSavePexelsKey() {

function showShortcuts() {
  const overlay = document.createElement('div');
  overlay.className = 'shortcuts-overlay';
  overlay.onclick = () => overlay.remove();
  overlay.innerHTML = `
    <div class="shortcuts-panel" onclick="event.stopPropagation()">
      <h2>📋 快捷键参考</h2>
      <div class="kbd-row"><span>全局搜索</span><kbd>Ctrl</kbd> + <kbd>K</kbd></div>
      <div class="kbd-row"><span>切换主题</span><kbd>Ctrl</kbd> + <kbd>T</kbd></div>
      <div class="kbd-row"><span>返回首页</span><kbd>Esc</kbd></div>
      <div class="kbd-row"><span>刷新页面</span><kbd>F5</kbd></div>
      <div class="kbd-row"><span>管理后台</span><kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>M</kbd></div>
      <div class="kbd-row"><span>导出数据</span><kbd>Ctrl</kbd> + <kbd>E</kbd></div>
      <div class="kbd-row"><span>显示此面板</span><kbd>?</kbd></div>
      <div style="margin-top:20px;text-align:center;">
        <button class="btn btn-outline btn-sm" onclick="this.closest('.shortcuts-overlay')?.remove()">关闭</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}
function showAdminModal(html) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = function(e) { if (e.target === overlay) closeAdminModal(); };
  overlay.innerHTML = `<div class="modal modal-edit" onclick="event.stopPropagation()"><div class="modal-body">${html}</div></div>`;
  document.body.appendChild(overlay);
  document.body.style.overflow = 'hidden';
}

function initKeyboardShortcuts() {
  document.addEventListener('keydown', e => {
    if (e.ctrlKey && e.key === 'k' && !e.target.matches('input,textarea')) {
      e.preventDefault();
      const search = document.getElementById('searchInput');
      if (search) { search.focus(); search.select(); }
    }
    if (e.ctrlKey && e.key === 't') { e.preventDefault(); toggleTheme(); }
    if (e.ctrlKey && e.shiftKey && e.key === 'm') { e.preventDefault(); navigate('/admin'); }
    if (e.ctrlKey && e.key === 'e' && adminAuthed) { e.preventDefault(); adminExportCSV(); }
    if (e.key === '?') { e.preventDefault(); showShortcuts(); }
    if (e.key === 'Escape') {
      if (document.querySelector('.shortcuts-overlay')) document.querySelector('.shortcuts-overlay').remove();
      else if (window.location.hash !== '#/') navigate('/');
    }
  });
}
function closeAdminModal() {
  const overlay = document.querySelector('.modal-overlay:not(.hidden)');
  if (overlay) overlay.remove();
  const hidden = document.getElementById('modalOverlay');
  if (hidden && !hidden.classList.contains('hidden')) return;
  document.body.style.overflow = '';
}

// ====== 路由系统 ======
function getRoute() { return window.location.hash.slice(1) || '/'; }

function navigate(path) {
  window.location.hash = '#' + path;
}

function renderRoute() {
  const route = getRoute();
  const app = document.getElementById('app');
  if (!app) return;

  // 更新导航高亮
  document.querySelectorAll('.nav-links a').forEach(a => {
    const r = a.getAttribute('data-route');
    a.classList.toggle('active', r === '/' ? (route === '/' || route.startsWith('/detail/')) : route === r);
  });

  // 路由匹配
  if (route === '/' || route === '') {
    activeCat = '全部';
    renderHome();
  } else if (route.startsWith('/detail/')) {
    const id = parseInt(route.split('/detail/')[1]);
    renderDetail(id);
  } else if (route === '/about') {
    renderAbout();
  } else if (route === '/upload') {
    renderUpload();
  } else if (route === '/favorites') {
    renderFavorites();
  } else if (route === '/admin') {
    renderAdmin();
  } else {
    navigate('/');
  }
}

// ====== 事件 ======
window.addEventListener('hashchange', renderRoute);
window.addEventListener('load', renderRoute);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
document.addEventListener('click', function(e) {
  const btn = e.target.closest('.btn');
  if (!btn) return;
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
  ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
  btn.appendChild(ripple);
  ripple.addEventListener('animationend', () => ripple.remove());
});

// 初始化快捷键
initKeyboardShortcuts();
// 初始化用户菜单
renderUserMenu();
</script>
<button class="back-to-top" id="backToTopBtn" aria-label="回到顶部" title="回到顶部">↑</button>
<script>
(function(){
  const btn = document.getElementById('backToTopBtn');
  if (!btn) return;
  let scrollTicking = false;
  window.addEventListener('scroll', () => {
    if (!scrollTicking) {
      requestAnimationFrame(() => {
        btn.classList.toggle('visible', window.scrollY > 400);
        scrollTicking = false;
      });
      scrollTicking = true;
    }
  }, { passive: true });
  btn.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
</script>
