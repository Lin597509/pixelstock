<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelStock - 高清视频素材库</title>
<meta name="description" content="PixelStock 高清视频素材库，精选 4K/8K 视频素材免费下载，覆盖自然风光、城市建筑、科技特效等多种场景。">
<style>
  /* ========== 主题变量 ========== */
  :root {
    --radius-sm: 8px;
    --radius: 12px;
    --radius-lg: 16px;
    --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }

  [data-theme="dark"] {
    --bg: #0a0a0f; --bg2: #0f0f17; --surface: #13131a; --surface2: #1a1a24;
    --surface3: #22222e; --border: #252530; --border-hover: #3a3a4a;
    --text: #e4e4eb; --text2: #b0b0c0; --text-dim: #8888a0;
    --accent: #6c5ce7; --accent2: #a29bfe; --accent-glow: rgba(108,92,231,0.25);
    --tag-bg: #1e1e2e; --card-shadow: 0 4px 24px rgba(0,0,0,0.4);
    --card-shadow-hover: 0 16px 48px rgba(108,92,231,0.18);
    --nav-bg: rgba(10,10,15,0.82); --hero-glow: radial-gradient(ellipse at 50% 50%, rgba(108,92,231,0.1) 0%, transparent 70%);
    --toast-bg: #1a1a24; --overlay-bg: rgba(0,0,0,0.88); --input-bg: #1a1a24;
    --scrollbar-thumb: #2a2a38; --scrollbar-track: transparent;
    --success: #00b894; --danger: #ff7675;
  }

  [data-theme="light"] {
    --bg: #f5f5fa; --bg2: #fafafe; --surface: #ffffff; --surface2: #f0f0f8;
    --surface3: #e8e8f2; --border: #e0e0ec; --border-hover: #c8c8d8;
    --text: #1a1a2e; --text2: #4a4a5e; --text-dim: #8888a0;
    --accent: #6c5ce7; --accent2: #5a4bd1; --accent-glow: rgba(108,92,231,0.15);
    --tag-bg: #e8e8f4; --card-shadow: 0 2px 16px rgba(0,0,0,0.06);
    --card-shadow-hover: 0 12px 36px rgba(108,92,231,0.12);
    --nav-bg: rgba(255,255,255,0.82); --hero-glow: radial-gradient(ellipse at 50% 50%, rgba(108,92,231,0.06) 0%, transparent 70%);
    --toast-bg: #ffffff; --overlay-bg: rgba(0,0,0,0.6); --input-bg: #f0f0f8;
    --scrollbar-thumb: #c8c8d8; --scrollbar-track: #f0f0f8;
    --success: #00b894; --danger: #e17055;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font); background: var(--bg);
    color: var(--text); line-height: 1.6; overflow-x: hidden;
    transition: background var(--transition), color var(--transition);
  }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }

  @keyframes fadeInUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes scaleIn { from { opacity:0; transform:scale(0.92); } to { opacity:1; transform:scale(1); } }
  @keyframes shimmer { 0%{background-position:-200% 0;} 100%{background-position:200% 0;} }

  .reveal { opacity:0; transform:translateY(30px); transition:opacity 0.6s ease, transform 0.6s ease; }
  .reveal.visible { opacity:1; transform:translateY(0); }

  /* ========== Navbar ========== */
  .navbar {
    position:sticky; top:0; z-index:100; background:var(--nav-bg);
    backdrop-filter:blur(24px) saturate(180%); -webkit-backdrop-filter:blur(24px) saturate(180%);
    border-bottom:1px solid var(--border); padding:0 24px;
    display:flex; align-items:center; justify-content:space-between; height:62px;
    transition:background var(--transition),border-color var(--transition);
  }
  .nav-logo {
    font-size:1.4rem; font-weight:800; cursor:pointer;
    background:linear-gradient(135deg,#6c5ce7,#a29bfe);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; letter-spacing:-0.5px;
  }
  .nav-links { display:flex; gap:28px; list-style:none; }
  .nav-links a {
    color:var(--text-dim); text-decoration:none; font-size:0.9rem;
    transition:var(--transition); font-weight:500; position:relative; padding:4px 0; cursor:pointer;
  }
  .nav-links a::after { content:''; position:absolute; bottom:-2px; left:0; width:0; height:2px; background:var(--accent); border-radius:1px; transition:width var(--transition); }
  .nav-links a:hover, .nav-links a.active { color:var(--text); }
  .nav-links a:hover::after, .nav-links a.active::after { width:100%; }
  .nav-actions { display:flex; gap:10px; align-items:center; }

  .theme-toggle {
    width:38px; height:38px; border-radius:50%; background:var(--surface2);
    border:1px solid var(--border); cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-size:1.1rem; transition:var(--transition); position:relative; overflow:hidden;
  }
  .theme-toggle:hover { border-color:var(--accent); transform:rotate(15deg); }
  .theme-toggle .icon-sun, .theme-toggle .icon-moon { position:absolute; transition:var(--transition); }
  [data-theme="dark"] .icon-sun { opacity:1; transform:scale(1); }
  [data-theme="dark"] .icon-moon { opacity:0; transform:scale(0.5); }
  [data-theme="light"] .icon-sun { opacity:0; transform:scale(0.5); }
  [data-theme="light"] .icon-moon { opacity:1; transform:scale(1); }

  /* ========== 按钮 ========== */
  .btn {
    padding:9px 22px; border-radius:var(--radius-sm); border:none;
    font-size:0.875rem; font-weight:600; cursor:pointer;
    transition:all var(--transition); font-family:inherit; position:relative; overflow:hidden;
  }
  .btn:active { transform:scale(0.96); }
  .btn-primary { background:var(--accent); color:#fff; box-shadow:0 4px 16px var(--accent-glow); }
  .btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 24px var(--accent-glow); }
  .btn-outline { background:transparent; color:var(--text); border:1px solid var(--border); }
  .btn-outline:hover { border-color:var(--accent); color:var(--accent); background:var(--surface2); }
  .btn-sm { padding:6px 16px; font-size:0.8rem; }
  .btn-download { background:linear-gradient(135deg,#00b894,#00cec9); color:#fff; border:none; }
  .btn-download:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,184,148,0.35); }
  .btn-lg { padding:12px 32px; font-size:1rem; }
  .btn-danger { background:var(--danger); color:#fff; }

  .ripple { position:absolute; border-radius:50%; background:rgba(255,255,255,0.3); transform:scale(0); animation:ripple 0.6s ease-out; pointer-events:none; }
  @keyframes ripple { to { transform:scale(4); opacity:0; } }

  /* ========== 页面容器 ========== */
  .page { animation:fadeInUp 0.4s ease; min-height:calc(100vh - 62px); }
  .page-container { max-width:1280px; margin:0 auto; padding:0 24px 60px; }

  /* ========== Hero（首页） ========== */
  .hero {
    padding:90px 24px 70px; text-align:center; position:relative; overflow:hidden;
  }
  .hero::before { content:''; position:absolute; top:-50%; left:-50%; width:200%; height:200%; background:var(--hero-glow); pointer-events:none; }
  .hero h1 { font-size:clamp(2rem,5vw,3.4rem); font-weight:800; letter-spacing:-1.5px; position:relative; }
  .hero h1 span { background:linear-gradient(135deg,#6c5ce7,#fd79a8,#00cec9); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-size:200% auto; animation:shimmer 3s linear infinite; }
  .hero p { color:var(--text-dim); font-size:1.1rem; max-width:560px; margin:18px auto 0; position:relative; }
  .hero-stats { display:flex; gap:48px; justify-content:center; margin-top:40px; position:relative; }
  .hero-stat { text-align:center; }
  .hero-stat .num { font-size:2rem; font-weight:800; background:linear-gradient(135deg,#6c5ce7,#a29bfe); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .hero-stat .label { font-size:0.82rem; color:var(--text-dim); margin-top:4px; }

  /* ========== Toolbar（首页） ========== */
  .toolbar { max-width:1280px; margin:0 auto; padding:0 24px 24px; display:flex; gap:16px; flex-wrap:wrap; align-items:center; }
  .search-box { flex:1; min-width:240px; position:relative; }
  .search-box input { width:100%; padding:13px 16px 13px 44px; background:var(--input-bg); border:1.5px solid var(--border); border-radius:var(--radius); color:var(--text); font-size:0.9rem; outline:none; transition:all var(--transition); }
  .search-box input:focus { border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-glow); }
  .search-box .icon { position:absolute; left:15px; top:50%; transform:translateY(-50%); color:var(--text-dim); pointer-events:none; }
  .filter-tags { display:flex; gap:8px; flex-wrap:wrap; }
  .tag { padding:7px 18px; border-radius:20px; background:var(--tag-bg); color:var(--text-dim); font-size:0.82rem; cursor:pointer; border:1.5px solid transparent; transition:all var(--transition); user-select:none; font-weight:500; }
  .tag:hover { border-color:var(--border-hover); color:var(--text); transform:translateY(-1px); }
  .tag.active { background:var(--accent); color:#fff; border-color:var(--accent); box-shadow:0 4px 12px var(--accent-glow); }

  /* ========== Grid ========== */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:22px; }
  .card {
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    overflow:hidden; transition:all var(--transition); cursor:pointer; box-shadow:var(--card-shadow);
  }
  .card:hover { border-color:var(--accent); transform:translateY(-6px); box-shadow:var(--card-shadow-hover); }
  .card-thumb { width:100%; height:190px; background:var(--surface2); position:relative; overflow:hidden; }
  .card-thumb .thumb-inner { width:100%; height:100%; display:flex; align-items:center; justify-content:center; transition:transform 0.5s ease; }
  .card:hover .thumb-inner { transform:scale(1.05); }
  .card-thumb .thumb-icon { font-size:3.2rem; opacity:0.5; transition:all var(--transition); }
  .card:hover .thumb-icon { opacity:0.7; transform:scale(1.1); }
  .card-badge { position:absolute; top:12px; right:12px; padding:4px 12px; border-radius:6px; font-size:0.7rem; font-weight:700; letter-spacing:0.5px; pointer-events:none; z-index:2; backdrop-filter:blur(8px); }
  .card-badge.free { background:rgba(0,184,148,0.88); color:#fff; }
  .card-badge.pro { background:rgba(253,121,168,0.88); color:#fff; }
  .card-body { padding:18px; }
  .card-title { font-size:0.95rem; font-weight:700; margin-bottom:6px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .card-meta { display:flex; gap:14px; flex-wrap:wrap; font-size:0.75rem; color:var(--text-dim); margin-bottom:14px; }
  .card-meta span { display:flex; align-items:center; gap:4px; }
  .card-actions { display:flex; gap:8px; }
  .card-actions .btn { flex:1; text-align:center; }

  /* ========== 详情页 ========== */
  .detail-hero {
    position:relative; overflow:hidden; padding:60px 0 40px;
    display:flex; gap:40px; align-items:flex-start;
  }
  .detail-preview {
    flex:0 0 520px; border-radius:var(--radius-lg); overflow:hidden;
    background:var(--surface2); border:1px solid var(--border);
    min-height:340px; display:flex; align-items:center; justify-content:center;
    transition:all var(--transition);
  }
  .detail-preview .preview-icon { font-size:6rem; opacity:0.4; }
  .detail-info { flex:1; }
  .detail-info h1 { font-size:1.8rem; font-weight:800; margin-bottom:8px; }
  .detail-info .detail-desc { color:var(--text-dim); font-size:1rem; margin-bottom:24px; line-height:1.7; }
  .detail-specs { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:24px; }
  .detail-spec {
    text-align:center; padding:14px 10px; background:var(--surface2);
    border-radius:var(--radius-sm); border:1px solid var(--border);
    transition:var(--transition);
  }
  .detail-spec:hover { border-color:var(--accent); }
  .detail-spec .spec-val { font-size:1.2rem; font-weight:700; }
  .detail-spec .spec-lbl { font-size:0.75rem; color:var(--text-dim); margin-top:2px; }
  .detail-actions { display:flex; gap:12px; }

  .back-link {
    display:inline-flex; align-items:center; gap:6px; color:var(--text-dim);
    text-decoration:none; font-size:0.85rem; margin-bottom:20px; cursor:pointer;
    transition:var(--transition);
  }
  .back-link:hover { color:var(--accent); }

  /* ========== 关于页 ========== */
  .about-hero {
    text-align:center; padding:80px 24px 50px; position:relative;
  }
  .about-hero::before { content:''; position:absolute; top:-50%; left:-50%; width:200%; height:200%; background:var(--hero-glow); pointer-events:none; }
  .about-hero h1 { font-size:2.2rem; font-weight:800; position:relative; }
  .about-hero .subtitle { color:var(--text-dim); font-size:1rem; margin-top:12px; position:relative; }
  .about-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px; margin-top:40px; }
  .about-card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-lg); padding:28px; text-align:center;
    transition:all var(--transition);
  }
  .about-card:hover { border-color:var(--accent); transform:translateY(-4px); }
  .about-card .icon { font-size:2.5rem; margin-bottom:16px; }
  .about-card h3 { font-size:1.1rem; margin-bottom:8px; }
  .about-card p { color:var(--text-dim); font-size:0.88rem; line-height:1.6; }

  .about-team { margin-top:50px; text-align:center; }
  .about-team h2 { font-size:1.5rem; margin-bottom:28px; }
  .team-grid { display:flex; gap:24px; justify-content:center; flex-wrap:wrap; }
  .team-card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-lg); padding:24px; text-align:center;
    width:200px; transition:var(--transition);
  }
  .team-card:hover { border-color:var(--accent); transform:translateY(-3px); }
  .team-avatar { width:64px; height:64px; border-radius:50%; background:var(--accent); margin:0 auto 14px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:1.5rem; font-weight:700; }
  .team-card h4 { font-size:0.95rem; }
  .team-card .role { color:var(--text-dim); font-size:0.78rem; margin-top:4px; }

  /* ========== 上传页 ========== */
  .upload-page { padding:60px 0; }
  .upload-page h1 { font-size:1.8rem; font-weight:800; margin-bottom:8px; }
  .upload-page .upload-sub { color:var(--text-dim); margin-bottom:32px; }
  .upload-zone {
    border:2px dashed var(--border); border-radius:var(--radius-lg);
    padding:60px 30px; text-align:center; cursor:pointer;
    transition:all var(--transition); background:var(--surface);
    margin-bottom:28px;
  }
  .upload-zone:hover, .upload-zone.drag-over {
    border-color:var(--accent); background:var(--surface2);
    box-shadow:0 0 0 6px var(--accent-glow);
  }
  .upload-zone .upload-icon { font-size:3.5rem; margin-bottom:16px; }
  .upload-zone h3 { font-size:1.1rem; margin-bottom:8px; }
  .upload-zone p { color:var(--text-dim); font-size:0.85rem; }
  .upload-form { display:grid; gap:16px; max-width:600px; }
  .form-group { display:flex; flex-direction:column; gap:6px; }
  .form-group label { font-size:0.85rem; font-weight:600; color:var(--text2); }
  .form-group input, .form-group select, .form-group textarea {
    padding:11px 14px; background:var(--input-bg); border:1.5px solid var(--border);
    border-radius:var(--radius-sm); color:var(--text); font-size:0.9rem;
    outline:none; transition:all var(--transition); font-family:inherit; resize:vertical;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow);
  }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .upload-preview-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; margin-top:12px; }
  .upload-preview-item {
    background:var(--surface2); border-radius:var(--radius-sm);
    padding:12px; text-align:center; border:1px solid var(--border);
    font-size:0.78rem;
  }
  .upload-preview-item .file-icon { font-size:1.8rem; margin-bottom:6px; }
  .upload-preview-item .file-name { color:var(--text); word-break:break-all; }
  .upload-preview-item .file-size { color:var(--text-dim); font-size:0.7rem; }

  /* ========== Modal ========== */
  .modal-overlay {
    position:fixed; inset:0; z-index:200; background:var(--overlay-bg);
    display:flex; align-items:center; justify-content:center; animation:fadeIn 0.25s ease;
    backdrop-filter:blur(4px);
  }
  .modal-overlay.hidden { display:none; }
  .modal {
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-lg); max-width:820px; width:92%;
    max-height:85vh; overflow-y:auto; animation:scaleIn 0.3s ease;
    box-shadow:0 24px 80px rgba(0,0,0,0.5);
  }
  .modal-header {
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 24px; border-bottom:1px solid var(--border);
    position:sticky; top:0; background:var(--surface); z-index:1;
    border-radius:var(--radius-lg) var(--radius-lg) 0 0;
  }
  .modal-header h3 { font-size:1.15rem; font-weight:700; }
  .modal-close { background:none; border:none; color:var(--text-dim); font-size:1.5rem; cursor:pointer; padding:4px 10px; border-radius:8px; transition:var(--transition); line-height:1; }
  .modal-close:hover { background:var(--surface2); color:var(--text); }
  .modal-body { padding:24px; }
  .modal-preview { width:100%; border-radius:var(--radius); overflow:hidden; background:var(--surface2); margin-bottom:20px; }
  .modal-preview .preview-placeholder { height:380px; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; }
  .modal-preview .preview-placeholder .preview-icon { font-size:5rem; }
  .modal-preview .preview-placeholder .preview-meta { color:var(--text-dim); font-size:0.9rem; }
  .modal-info { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .modal-info-item { text-align:center; padding:14px 8px; background:var(--surface2); border-radius:var(--radius-sm); transition:var(--transition); }
  .modal-info-item:hover { background:var(--surface3); }
  .modal-info-item .val { font-size:1.15rem; font-weight:700; }
  .modal-info-item .lbl { font-size:0.75rem; color:var(--text-dim); margin-top:2px; }
  .modal-tags { display:flex; gap:8px; flex-wrap:wrap; margin-top:18px; }
  .modal-footer { padding:18px 24px; border-top:1px solid var(--border); display:flex; gap:12px; justify-content:flex-end; }

  /* ========== Toast ========== */
  .toast {
    position:fixed; bottom:32px; left:50%; transform:translateX(-50%);
    background:var(--toast-bg); color:var(--text);
    padding:14px 28px; border-radius:var(--radius); border:1px solid var(--border);
    font-size:0.85rem; z-index:300; font-weight:500;
    box-shadow:0 8px 32px rgba(0,0,0,0.3);
    animation:toastIn 0.35s ease; backdrop-filter:blur(12px);
  }
  @keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(16px);} to{opacity:1;transform:translateX(-50%) translateY(0);} }

  /* ========== Footer ========== */
  .footer { border-top:1px solid var(--border); padding:44px 24px; text-align:center; color:var(--text-dim); font-size:0.84rem; transition:border-color var(--transition); }
  .footer a { color:var(--accent); text-decoration:none; cursor:pointer; }
  .footer a:hover { text-decoration:underline; }

  /* ========== 管理后台 ========== */
  .admin-login {
    max-width:400px; margin:100px auto; text-align:center;
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-lg); padding:40px;
    box-shadow:0 20px 60px rgba(0,0,0,0.1);
    animation:slideUp 0.5s ease-out;
  }
  .admin-login h2 { font-size:1.3rem; margin-bottom:24px; }
  .admin-login .form-group { margin-bottom:16px; text-align:left; }
  .admin-login input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(108,92,231,0.1); }
  .admin-stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:32px; }
  .admin-stat-card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:22px; text-align:center; transition:var(--transition);
    position:relative; overflow:hidden;
  }
  .admin-stat-card::before {
    content:''; position:absolute; top:0; left:0; width:100%; height:4px;
    background:linear-gradient(90deg, var(--accent), #6c5ce7);
    opacity:0; transition:opacity 0.3s ease;
  }
  .admin-stat-card:hover { border-color:var(--accent); transform:translateY(-4px); box-shadow:0 12px 30px rgba(108,92,231,0.15); }
  .admin-stat-card:hover::before { opacity:1; }
  .admin-stat-card .stat-num { font-size:2rem; font-weight:800; color:var(--accent); }
  .admin-stat-card .stat-lbl { font-size:0.8rem; color:var(--text-dim); margin-top:4px; }
  .admin-table-wrap { overflow-x:auto; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); }
  .admin-table { width:100%; border-collapse:collapse; font-size:0.85rem; }

  /* ========== 动画 Keyframes ========== */
  @keyframes slideUp {

// ====== 主题 ======
function toggleTheme() {
  const html=document.documentElement, cur=html.getAttribute('data-theme');
  html.setAttribute('data-theme', cur==='dark'?'light':'dark');
  localStorage.setItem('pixelstock-theme', cur==='dark'?'light':'dark');
}
(function(){ const s=localStorage.getItem('pixelstock-theme'); if(s) document.documentElement.setAttribute('data-theme',s); })();

// ====== 工具函数 ======
function thumbBg(id) {
  const c=['linear-gradient(135deg,#1a1a2e,#16213e)','linear-gradient(135deg,#0f3460,#16213e)','linear-gradient(135deg,#2d1b69,#1a1a2e)','linear-gradient(135deg,#1b4332,#081c15)','linear-gradient(135deg,#3c096c,#240046)','linear-gradient(135deg,#023e8a,#03045e)','linear-gradient(135deg,#4a0e4e,#1b1a2e)','linear-gradient(135deg,#0b525b,#0a1c2a)'];
  return c[id%c.length];
}
function showToast(msg) {
  const e=document.querySelector('.toast'); if(e)e.remove();
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(-50%) translateY(10px)';t.style.transition='all 0.3s ease';setTimeout(()=>t.remove(),300);},2200);
}

// ====== 弹窗 ======
function openPreview(id) {
  currentAsset=ASSETS.find(a=>a.id===id); if(!currentAsset) return;

  document.getElementById('modalPreview').innerHTML=`<div class="preview-placeholder" style="background:${thumbBg(currentAsset.id)};"><span class="preview-icon">🎬</span><span class="preview-meta">${currentAsset.res} / ${currentAsset.format} / ${currentAsset.dur}</span></div>`;
  document.getElementById('modalInfo').innerHTML=['分辨率','帧率','文件大小','时长','格式','授权'].map((l,i)=>`<div class="modal-info-item"><div class="val">${[currentAsset.res,currentAsset.fps+'fps',currentAsset.size,currentAsset.dur,currentAsset.format,currentAsset.badge==='free'?'免费':'PRO'][i]}</div><div class="lbl">${l}</div></div>`).join('');
  document.getElementById('modalTags').innerHTML=`<span class="tag active">${currentAsset.cat}</span><span class="tag">${currentAsset.res}</span><span class="tag">${currentAsset.format}</span>`;
  document.getElementById('modalDownloadBtn').onclick=()=>{downloadAsset(currentAsset.id);};
  document.getElementById('modalDetailBtn').onclick=()=>{closeModal();navigate('/detail/'+currentAsset.id);};
  document.getElementById('modalOverlay').classList.remove('hidden');
  document.body.style.overflow='hidden';
}
function closeModal(e) { if(e&&e.target!==document.getElementById('modalOverlay'))return; document.getElementById('modalOverlay').classList.add('hidden'); document.body.style.overflow=''; currentAsset=null; }
function downloadAsset(id){ const a=ASSETS.find(x=>x.id===id); if(!a)return; showToast(`正在准备下载「${a.title}」(${a.size})...`); setTimeout(()=>showToast(`「${a.title}」下载完成！`),1500); }

function filterAssets() {
  const q=(document.getElementById('searchInput')||{}).value||'';
  return ASSETS.filter(a=>{
    const mc=activeCat==='全部'||a.cat===activeCat;
    const ms=!q||a.title.toLowerCase().includes(q.toLowerCase())||a.cat.includes(q)||a.desc.includes(q);
    return mc&&ms;
  });
}

      <input type="file" id="fileInput" multiple accept="video/*" style="display:none" onchange="handleUploadFiles(this.files)">

      <div class="upload-form" style="margin-top:24px;">
        <div class="form-group"><label>素材标题 *</label><input type="text" id="uploadTitle" placeholder="输入素材标题"></div>
        <div class="form-row">
          <div class="form-group"><label>分类 *</label><select id="uploadCat"><option value="">选择分类</option>${cats.filter(c=>c!=='全部').map(c=>`<option>${c}</option>`).join('')}</select></div>
          <div class="form-group"><label>分辨率</label><select id="uploadRes"><option>4K</option><option>8K</option><option>1080p</option><option>2K</option></select></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>帧率 (fps)</label><input type="number" id="uploadFps" placeholder="如 24, 30, 60" min="1" max="120"></div>

        </div>

          <button class="btn btn-primary btn-lg" onclick="submitUpload()">提交上传</button>
          <button class="btn btn-outline btn-lg" onclick="resetUpload()">重置</button>
        </div>
      </div>
    </div>
  `;

  // 拖拽上传
  const zone=document.getElementById('uploadZone');
  zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('drag-over');});
  zone.addEventListener('dragleave',()=>zone.classList.remove('drag-over'));
  zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('drag-over');handleUploadFiles(e.dataTransfer.files);});
}

let uploadedFiles=[];
function handleUploadFiles(files) {
  uploadedFiles=Array.from(files).slice(0,5);
  const preview=document.getElementById('uploadPreview');
  if(!preview) return;
  preview.innerHTML=uploadedFiles.map((f,i)=>`
    <div class="upload-preview-item">
      <div class="file-icon">🎬</div>
      <div class="file-name">${f.name.substring(0,20)}${f.name.length>20?'...':''}</div>
      <div class="file-size">${(f.size/1024/1024).toFixed(1)} MB</div>
      <button class="btn btn-outline btn-sm" style="margin-top:8px;font-size:0.7rem;" onclick="removeUploadFile(${i})">移除</button>
    </div>
  `).join('');
}
function removeUploadFile(i){uploadedFiles.splice(i,1);handleUploadFiles({length:0,...uploadedFiles});}
function resetUpload(){uploadedFiles=[];renderUpload();}
function submitUpload() {
  const title=document.getElementById('uploadTitle')?.value, cat=document.getElementById('uploadCat')?.value;
  if(!title){showToast('请输入素材标题');return;}
  if(!cat){showToast('请选择分类');return;}
  if(!uploadedFiles.length){showToast('请选择至少一个视频文件');return;}
  const newId=ASSETS.length+1;
  const res=document.getElementById('uploadRes')?.value||'4K';
  const fps=parseInt(document.getElementById('uploadFps')?.value)||30;
  const license=document.getElementById('uploadLicense')?.value||'free';
  const desc=document.getElementById('uploadDesc')?.value||'用户上传素材';
  ASSETS.push({id:newId,title,cat,res,dur:'未知',size:'未知',fps,format:'MP4',badge:license,desc,status:'pending'});
  showToast(`素材「${title}」已提交审核！`);
  setTimeout(()=>navigate('/'),800);
}

function adminExportCSV() {
  const headers = ['ID','标题','分类','分辨率','时长','大小','帧率','格式','授权','状态','描述'];
  const rows = ASSETS.map(a => [
    a.id, a.title, a.cat, a.res, a.dur, a.size, a.fps, a.format, a.badge, a.status||'approved', a.desc
  ]);
  const csv = [headers.join(','), ...rows.map(r => r.map(v => `"${v}"`).join(','))].join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `PixelStock_素材库_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(`已导出 ${ASSETS.length} 条数据`);
}

      <h2>📋 快捷键参考</h2>
      <div class="kbd-row"><span>全局搜索</span><kbd>Ctrl</kbd> + <kbd>K</kbd></div>
      <div class="kbd-row"><span>切换主题</span><kbd>Ctrl</kbd> + <kbd>T</kbd></div>
      <div class="kbd-row"><span>返回首页</span><kbd>Esc</kbd></div>
      <div class="kbd-row"><span>刷新页面</span><kbd>F5</kbd></div>
      <div class="kbd-row"><span>管理后台</span><kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>M</kbd></div>
      <div class="kbd-row"><span>导出数据</span><kbd>Ctrl</kbd> + <kbd>E</kbd></div>
      <div class="kbd-row"><span>显示此面板</span><kbd>?</kbd></div>
      <div style="margin-top:20px;text-align:center;">
        <button class="btn btn-outline btn-sm" onclick="this.closest('.shortcuts-overlay')?.remove()">关闭</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}
function showAdminModal(html) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = function(e) { if (e.target === overlay) closeAdminModal(); };
  overlay.innerHTML = `<div class="modal modal-edit" onclick="event.stopPropagation()"><div class="modal-body">${html}</div></div>`;
  document.body.appendChild(overlay);
  document.body.style.overflow = 'hidden';
}

function initKeyboardShortcuts() {
  document.addEventListener('keydown', e => {
    if (e.ctrlKey && e.key === 'k' && !e.target.matches('input,textarea')) {
      e.preventDefault();
      const search = document.getElementById('searchInput');
      if (search) { search.focus(); search.select(); }
    }
    if (e.ctrlKey && e.key === 't') { e.preventDefault(); toggleTheme(); }
    if (e.ctrlKey && e.shiftKey && e.key === 'm') { e.preventDefault(); navigate('/admin'); }
    if (e.ctrlKey && e.key === 'e' && adminAuthed) { e.preventDefault(); adminExportCSV(); }
    if (e.key === '?') { e.preventDefault(); showShortcuts(); }
    if (e.key === 'Escape') {
      if (document.querySelector('.shortcuts-overlay')) document.querySelector('.shortcuts-overlay').remove();
      else if (window.location.hash !== '#/') navigate('/');
    }
  });
}
function closeAdminModal() {
  const overlay = document.querySelector('.modal-overlay:not(.hidden)');
  if (overlay) overlay.remove();
  const hidden = document.getElementById('modalOverlay');
  if (hidden && !hidden.classList.contains('hidden')) return;
  document.body.style.overflow = '';
}

// ====== 路由系统 ======
function getRoute() { return window.location.hash.slice(1) || '/'; }

function navigate(path) {
  window.location.hash = '#' + path;
}

function renderRoute() {
  const route = getRoute();
  const app = document.getElementById('app');
  if (!app) return;

  // 更新导航高亮
  document.querySelectorAll('.nav-links a').forEach(a => {
    const r = a.getAttribute('data-route');
    a.classList.toggle('active', r === '/' ? (route === '/' || route.startsWith('/detail/')) : route === r);
  });

  // 路由匹配
  if (route === '/' || route === '') {
    activeCat = '全部';
    renderHome();
  } else if (route.startsWith('/detail/')) {
    const id = parseInt(route.split('/detail/')[1]);
    renderDetail(id);
  } else if (route === '/about') {
    renderAbout();
  } else if (route === '/upload') {
    renderUpload();
  } else if (route === '/admin') {
    renderAdmin();
  } else {
    navigate('/');
  }
}

// ====== 事件 ======
window.addEventListener('hashchange', renderRoute);
window.addEventListener('load', renderRoute);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
document.addEventListener('click', function(e) {
  const btn = e.target.closest('.btn');
  if (!btn) return;
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
  ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
  btn.appendChild(ripple);
  ripple.addEventListener('animationend', () => ripple.remove());
});

// 初始化快捷键
initKeyboardShortcuts();
</script>
</body>
</html>
